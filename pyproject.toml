[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-quant"
version = "0.2.0"
description = "Atlas Quant - point-in-time financial data, evidence kernel and research terminal"
requires-python = ">=3.11"
# Economic-model execution is imported by the application runtime, including
# clean-install and database workflows that do not request the learning extra.
# NumPy is therefore a core runtime dependency, not only a training dependency.
dependencies = ["numpy>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
columnar = ["pyarrow>=15"]  # optional: Parquet market-bar import
learning = [
  "numpy>=2.5,<3",
  "scipy>=1.18,<2",
  "scikit-learn>=1.9,<2",
  "pyarrow>=15",
]  # Phase 6 trained models and calibration; CPU only
terminal = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]  # HTTP API + static hosting

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require live internet access (excluded by default)",
    "slow: long-running benchmarks",
]
