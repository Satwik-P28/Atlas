[build-system]
# setuptools>=77 is the first release that implements PEP 639 (a SPDX `license` expression and
# `license-files`), which is how the Apache-2.0 grant is published in the wheel and sdist metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-quant"
# Single source of truth: atlas.__version__. Duplicating the number here is how a package
# ends up reporting one version and shipping another.
dynamic = ["version"]
description = "Atlas: The Evidence-First Financial Research Operating System"
requires-python = ">=3.12"
# Apache-2.0 covers Atlas-authored code, documentation and project-authored synthetic fixtures.
# It does not relicense third-party data or dependencies; NOTICE and THIRD_PARTY_NOTICES.md state
# the boundary, and both ship inside the wheel's dist-info.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Satwik Peddireddi" }]
# NumPy is a core runtime dependency: atlas.economic.model imports it at module
# scope and the applications service imports that model, so every install needs it.
# It previously lived only in the optional learning extra, which made the '.[dev]'
# and '.[dev,terminal]' integrity jobs fail during collection. It is declared once
# here and no longer repeated in the learning extra.
# Exchange calendars resolve "America/New_York" through zoneinfo, and Windows ships no IANA
# time zone database: without this the packaged application raised ZoneInfoNotFoundError on
# its first command (found by the hosted Windows install matrix). It is declared for every
# platform because a slim Linux image may also lack /usr/share/zoneinfo.
dependencies = ["numpy>=2.5,<3", "tzdata>=2024.1"]

# Presentation links for the package page. They name the public distribution repository, which
# serves this release; the development repository is a separate, private archive.
[project.urls]
Homepage = "https://github.com/Satwik-P28/Atlas"
Repository = "https://github.com/Satwik-P28/Atlas"
Documentation = "https://github.com/Satwik-P28/Atlas/blob/main/docs/QUICKSTART.md"
Changelog = "https://github.com/Satwik-P28/Atlas/blob/main/RELEASE_NOTES.md"
Issues = "https://github.com/Satwik-P28/Atlas/issues"
Security = "https://github.com/Satwik-P28/Atlas/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "build>=1"]
# Convex decision programs, revision certificates and their baselines. Deliberately its own
# extra: the packaging contract forbids pulling the numerical stack into `dev`, and the
# decision tests skip cleanly when this extra is absent.
optimization = ["scipy>=1.18,<2", "osqp>=1,<2", "clarabel>=0.11,<1"]
columnar = ["pyarrow>=15"]  # optional: Parquet market-bar import
learning = [
  "scipy>=1.18,<2",
  "scikit-learn>=1.9,<2",
  "pyarrow>=15",
]  # Phase 6 trained models and calibration; CPU only (numpy is a core dependency)
terminal = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]  # HTTP API + static hosting


[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "atlas.__version__" }

[tool.setuptools.package-data]
# The demonstration fixture subset is staged here by scripts/build_release_artifacts.py so a
# wheel install can run `atlas demo` without a source checkout.
atlas = ["py.typed", "_demo_fixtures/**/*", "_web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: tests that require live internet access (excluded by default)",
    "slow: long-running benchmarks",
]
