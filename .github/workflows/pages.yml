name: Landing page

# Publishes the static product landing page in docs/launch/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: GitHub Actions (see docs/PUBLIC_RELEASE_HANDOVER.md §6).
# The page is static: it serves no API and never exposes the local Atlas service.

on:
  push:
    branches: [main]
    paths:
      - "docs/launch/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish docs/launch to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/launch
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
